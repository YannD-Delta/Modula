# Layout Studio options of the Modula Fullscreen theme (read by tools/convert_options.py, which writes layout-studio.schema.json).
# Every key here is a constant of Constants.xaml; defaults must equal the values there (tools/check-theme.py compares them).
Presets:
    Accent:
        Name: 'Accent colour'
        LocKey: LOCHNDFsPresetAccent
        Presets:
            Default:
                Name: 'Neon blue'
                LocKey: LOCHNDFsPresetAccentDefault
            Violet:
                Name: 'Violet'
                LocKey: LOCHNDFsPresetAccentViolet
                Constants:
                    GlyphColor:
                        Type: Color
                        Value: '#FFA66BFF'
                    GlyphLightColor:
                        Type: Color
                        Value: '#FFD0B0FF'
            Mint:
                Name: 'Mint'
                LocKey: LOCHNDFsPresetAccentMint
                Constants:
                    GlyphColor:
                        Type: Color
                        Value: '#FF3DE0B0'
                    GlyphLightColor:
                        Type: Color
                        Value: '#FF9AF5DC'
            Amber:
                Name: 'Amber'
                LocKey: LOCHNDFsPresetAccentAmber
                Constants:
                    GlyphColor:
                        Type: Color
                        Value: '#FFFFB347'
                    GlyphLightColor:
                        Type: Color
                        Value: '#FFFFD79A'
            Rose:
                Name: 'Rose'
                LocKey: LOCHNDFsPresetAccentRose
                Constants:
                    GlyphColor:
                        Type: Color
                        Value: '#FFFF6B9A'
                    GlyphLightColor:
                        Type: Color
                        Value: '#FFFFB0CC'
            Cyan:
                Name: 'Cyan'
                LocKey: LOCHNDFsPresetAccentCyan
                Constants:
                    GlyphColor:
                        Type: Color
                        Value: '#FF34E7FF'
                    GlyphLightColor:
                        Type: Color
                        Value: '#FF9AF2FF'
    Corners:
        Name: 'Corner rounding'
        LocKey: LOCHNDFsPresetCorners
        Presets:
            Default:
