Variables:
    HeaderCards:
        Title: 'Cards and focus'
        LocKey: LOCHNDFsHeaderCards
        Type: Header
    FsCardCornerRadius:
        Title: 'Card corners'
        LocKey: LOCHNDFsOptCardCornerRadius
        Type: CornerRadius
        Default: '16'
        Description: 'Roundness of the cover cards in the game list.'
    FsCardRimCornerRadius:
        Title: 'Focus ring corners'
        LocKey: LOCHNDFsOptCardRimCornerRadius
        Type: CornerRadius
        Default: '18'
        Description: 'Roundness of the ring around the focused card: about two more than the card corners.'
    FsFocusRingThickness:
        Title: 'Focus ring thickness'
        LocKey: LOCHNDFsOptFocusRingThickness
        Type: Thickness
        Default: '3'
        Description: 'Width of the neon ring around the focused card.'
    FsFocusGlowOpacity:
        Title: 'Focus glow'
        LocKey: LOCHNDFsOptFocusGlowOpacity
        Type: Double
        Default: '0.9'
        Description: 'Strength of the glow around the focused card (0 = no glow, lighter on the GPU).'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    FsFocusGlowBlur:
        Title: 'Focus glow size'
        LocKey: LOCHNDFsOptFocusGlowBlur
        Type: Double
        Default: '26'
        Description: 'How far the glow spreads.'
        Slider:
            Min: '0'
            Max: '60'
            Step: '1'
    FsGlassRimOpacity:
        Title: 'Glass edge'
        LocKey: LOCHNDFsOptGlassRimOpacity
        Type: Double
        Default: '1'
        Description: 'Strength of the thin lit edge of every card (0 = no edge).'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    FsTitleStripOpacity:
        Title: 'Title strip'
        LocKey: LOCHNDFsOptTitleStripOpacity
        Type: Double
        Default: '1'
        Description: 'Opacity of the dark strip under the game title on a card.'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    HeaderDetails:
        Title: 'Tiles and buttons'
        LocKey: LOCHNDFsHeaderDetails
        Type: Header
    FsCoverCornerRadius:
        Title: 'Cover corners (details page)'
        LocKey: LOCHNDFsOptCoverCornerRadius
        Type: CornerRadius
        Default: '22'
        Description: 'Roundness of the cover on the game page.'
    FsTileCornerRadius:
        Title: 'Info tile corners'
        LocKey: LOCHNDFsOptTileCornerRadius
        Type: CornerRadius
        Default: '16'
        Description: 'Roundness of the tiles under the title (time played, last played...).'
    FsTileGlassOpacity:
        Title: 'Info tile glass'
        LocKey: LOCHNDFsOptTileGlassOpacity
        Type: Double
        Default: '0.5'
        Description: 'How visible the info tiles are (0 = invisible).'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    FsPanelCornerRadius:
        Title: 'Menu and dialog corners'
        LocKey: LOCHNDFsOptPanelCornerRadius
        Type: CornerRadius
        Default: '24'
        Description: 'Roundness of menus and dialogs.'
    FsButtonCornerRadius:
        Title: 'Button corners'
        LocKey: LOCHNDFsOptButtonCornerRadius
        Type: CornerRadius
        Default: '12'
        Description: 'Roundness of buttons and menu entries.'
# BEGIN tokens:variables
# generated by tools/sync_tokens.py from the `variable` entries of the token file; do not edit by hand
    FsChipCornerRadius:
        Title: 'Chip corners'
        LocKey: LOCHNDFsOptChipCornerRadius
        Type: CornerRadius
        Default: '12'
        Description: 'Roundness of the genre and tag chips on the details page.'
    FsControlCornerRadius:
        Title: 'Input corners'
        LocKey: LOCHNDFsOptControlCornerRadius
        Type: CornerRadius
        Default: '8'
        Description: 'Roundness of text fields and the entries of selection lists.'
    FsPopupCornerRadius:
        Title: 'Popup menu corners'
        LocKey: LOCHNDFsOptPopupCornerRadius
        Type: CornerRadius
        Default: '20'
        Description: 'Roundness of the game menu.'
    FsGlassFillOpacity:
        Title: 'Panel glass'
        LocKey: LOCHNDFsOptGlassFillOpacity
        Type: Double
        Default: '0.92'
        Description: 'How opaque the menus and dialogs are (lower lets the game show through).'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    FsPopupShadowOpacity:
        Title: 'Popup shadow'
        LocKey: LOCHNDFsOptPopupShadowOpacity
        Type: Double
        Default: '0.55'
        Description: 'Strength of the shadow under the menus (0 = none.'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
    FsBackgroundDarkness:
        Title: 'Background darkness'
        LocKey: LOCHNDFsOptBackgroundDarkness
        Type: Double
        Default: '1'
        Description: 'How much the artwork behind the lists is darkened (1 = the console look; lower shows more of the artwork).'
        Slider:
            Min: '0'
            Max: '1'
            Step: '0.05'
# END tokens:variables
