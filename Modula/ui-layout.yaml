          - {page: gamepage, block: page-background, text: 'Opacity and tint of the game page artwork'}
      # BEGIN generated backdrop block
      - id: backdrop
        title: 'Generated backdrop'
        regions: [window]
        editor: backdrop
        presets: [Backdrop]
        settings: [BackdropFallbackOnly, BackdropColor1, BackdropColor2, BackdropColor3, BackdropAngle, BackdropMidpoint, BackdropThirdColor,
                   BackdropBlobCount, BackdropBlobScale, BackdropSpread, BackdropBlobOpacityScale, BackdropHardness, BackdropDarkness]
