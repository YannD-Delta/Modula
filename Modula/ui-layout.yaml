               BackdropPatternColor, BackdropAspect, BackdropBlob1X, BackdropBlob1Y, BackdropBlob1Size, BackdropBlob1Opacity, BackdropBlob1Color,
               BackdropBlob2X, BackdropBlob2Y, BackdropBlob2Size, BackdropBlob2Opacity, BackdropBlob2Color, BackdropBlob3X, BackdropBlob3Y,
               BackdropBlob3Size, BackdropBlob3Opacity, BackdropBlob3Color, BackdropBlob4X, BackdropBlob4Y, BackdropBlob4Size, BackdropBlob4Opacity,
               BackdropBlob4Color, BackdropBlob5X, BackdropBlob5Y, BackdropBlob5Size, BackdropBlob5Opacity, BackdropBlob5Color, BackdropBlob6X,
