# The home of every option of the Modula theme in the Layout Studio editor.
# Read by tools/convert_options.py (it builds the pages and blocks of layout-studio.schema.json from it) and checked by tests/ui_layout_test.py
# and by the schema tests: every constant has EXACTLY ONE home (a page + a block) and every preset group exactly one block.
#
#   pages     the ten pages of the editor, in order: id, title, summary, regions (the rectangles of the window plan the page lights)
#   blocks    plain headed blocks of a page (two levels only: page, block)
#       editor    a specialised editor shown in the block: background, tiles, sections, items, colors, rules, corners, sizes, advice, share, diagnostics
#       presets   preset groups (tiles) shown at the top of the block
#       settings  options shown as generated controls
#       more      rarely changed options, behind ONE "More" link of the block
#       owned     options edited by the block's editor, or set only by the block's presets: no generated control
#       see_also  links to other places that show or touch the same thing (never a second editable copy)
#       addon     (Add-ons page) which add-on the block describes: how to detect it, the items it feeds, what it provides
#   aliases   page / block ids older versions of the editor, the theme (OpenEditor) and the advice texts use
#
# A new option gets its home by adding its key to ONE of the lists below (settings, more or owned); the converter and the tests refuse an
# option without a home or with two.
version: 1
pages:
  - id: presets
    title: 'Global preset'
    summary: 'The whole look in one click: pick a global preset, or go back to the default one.'
    regions: [window]
    blocks:
      - id: global-presets
